[project]
name = "ml-tabular-pfs"
version = "0.1.0"
description = "Сервис прогноза месячных продаж (Kaggle Predict Future Sales, LightGBM)"
readme = "README.md"
requires-python = ">=3.11.17"
dependencies = [
    "fastapi==0.163.1",
    "lightgbm==4.7.0",
    "matplotlib==3.11.2",
    "mlflow>=3.18.0",
    "nbformat==5.11.1",
    "optuna==5.0.0",
    "pandas==3.1.0",
    "plotly==7.1.0",
    "pyarrow==26.0.1",
    "scikit-learn==1.9.1",
    "seaborn==0.13.2",
    "statsmodels==0.15.0",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "httpx2==2.16.2",
    "ipykernel==7.4.0",
    "pandas-stubs==3.1.0.261029",
    "pyright==1.1.414",
    "pytest==9.2.0",
    "ruff==0.17.2",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "pfs"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
include = ["."]
# Data, generated artifacts and tmp/ (reference notebooks and scripts, not checked).
exclude = [
    "**/.venv", "**/.git", "**/__pycache__", "**/.pytest_cache",
    "**/.ruff_cache", "**/.ipynb_checkpoints", "build", "dist", "data", "typings", "tmp"
]

[tool.ruff]
target-version = "py311"
line-length = 100
# tmp/ holds reference notebooks and scripts and is not checked.
extend-exclude = ["data", "tmp"]
respect-gitignore = false

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
extend-select = ["UP", "SIM", "RUF100"]
